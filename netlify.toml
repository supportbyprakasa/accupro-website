# Production Netlify config. GitHub Pages remains the noindex preview target;
# a Netlify build from main is indexable and uses the public canonical domain.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PREVIEW = "0"
  SITE_URL = "https://accuprointernational.co.id"
