name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # PREVIEW=1 puts `noindex, nofollow` on all 36 pages and makes robots.txt
      # Disallow: /. This is a verbatim rebuild of a live client site, so an
      # indexable copy would compete with the real domain as duplicate content.
      - name: Build (preview, noindex)
        env:
          PREVIEW: '1'
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: Fail if any page is missing the noindex tag
        run: |
          total=$(find dist -name '*.html' | wc -l)
          tagged=$(grep -l 'name="robots" content="noindex' $(find dist -name '*.html') | wc -l)
          echo "pages=$total tagged=$tagged"
          test "$total" -eq "$tagged"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
